# .65: /etc/nginx/conf.d/truyen.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here. The build of apps/web
# (pages, stories and their media under /stories/) in the current release, served as static files; /api/, /auth/
# and /healthz go to the Node server truyen-server on loopback :5300 of this host (sign-in and the reader's saved
# stories, progress and history; reading never needs it). The release also carries that server's bundle under
# server/, which is never served. The Cloudflare real-IP restore is global on this host, so $remote_addr is the
# visitor's IP; the server trusts X-Forwarded-For from loopback only.

server {
    listen 80;
    listen [::]:80;
    server_name truyen.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name truyen.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/truyen.hoandat.com.access.log;
    error_log  /var/log/nginx/truyen.hoandat.com.error.log;

    root /var/www/truyen/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json;
    # The API's largest body is a sync of the reading progress (a few kB).
    client_max_body_size 32k;

    # Not indexed while the release carries the marker file the build writes when apps/web/site-indexing.ts says
    # INDEXABLE = false (with robots.txt `Disallow: /` and a robots meta tag). An empty value sends no header, so
    # the launch is a release with the flag flipped, never an edit here.
    set $truyen_robots "";
    if (-f $document_root/noindex) {
        set $truyen_robots "noindex, nofollow";
    }

    # No inline script or style in the build (React sets styles through the DOM, which CSP allows); fonts are
    # self-hosted; pictures, scene videos, voice and music are files under /stories/. Images may also come from
    # Google and GitHub: the account pictures in the header's account menu. The page only talks to its own /api/
    # (connect-src 'self'); sign-in is a plain link to /auth/login, which redirects to auth.hoandat.com, so neither
    # connect-src nor form-action needs the IdP. Cloudflare Web Analytics: the zone injects its beacon (no
    # cookies), as on the sibling apps. The iPhone app's policy is derived from this line (apps/web/vite-native.ts).
    set $truyen_csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; media-src 'self'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # The API and sign-in (apps/server). It sends its own security headers (helmet) and Cache-Control.
    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5300;
        proxy_set_header Host $host;
    }

    # The server bundle and its migrations travel inside each release (server/); they are never served.
    location ^~ /server/ {
        return 404;
    }

    # nginx drops inherited add_header lines in a block that declares its own, so each location repeats them.

    # Vite fingerprints everything under /assets/: cached for a year; a miss is a real 404, never index.html
    # served as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri =404;
    }

    # The story list, each story.json and its media keep fixed names: revalidated, so a new story or a redrawn
    # picture shows on the next visit. A miss is a real 404 (the player reports it), not the app's HTML.
    # nginx serves byte ranges, which video seeking needs.
    location /stories/ {
        types {
            application/json json;
            image/webp       webp;
            video/mp4        mp4;
            audio/mp4        m4a;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri =404;
    }

    # Reading-scene backdrops (AVIF with a WebP fallback, painted on the home PC): fixed names, revalidated.
    location /reading-scenes/ {
        types {
            image/avif avif;
            image/webp webp;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri =404;
    }

    # The web manifest: the stock mime.types has no .webmanifest entry, so it would go out as
    # application/octet-stream. The types block here only replaces the map for this one address.
    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri =404;
    }

    # The reader's own pages (saved stories, history): the app page, never indexed whatever the release says.
    location ~ ^/(tu-truyen|lich-su)/?$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /spa.html =404;
    }

    # The pages: /, /tre-em, /nguoi-lon and each /truyen/<slug> have their own prerendered index.html (title,
    # description, the story list; apps/web/vite-prerender.ts); every other address (legal pages, 404) gets the
    # app page spa.html. They and the other unhashed files (robots.txt, icons, manifest) are revalidated on every
    # visit, so a browser never keeps a page that points at chunks of a previous release.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri $uri/index.html /spa.html;
    }
}
