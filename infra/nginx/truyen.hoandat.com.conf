# .65: /etc/nginx/conf.d/truyen.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here. Static files only: the
# build of apps/web (pages, stories and their media under /stories/) in the current release, put there by
# infra/deploy.sh. No server process.

server {
    listen 80;
    listen [::]:80;
    server_name truyen.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name truyen.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/truyen.hoandat.com.access.log;
    error_log  /var/log/nginx/truyen.hoandat.com.error.log;

    root /var/www/truyen/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json;

    # Not indexed while the release carries the marker file the build writes when apps/web/site-indexing.ts says
    # INDEXABLE = false (with robots.txt `Disallow: /` and a robots meta tag). An empty value sends no header, so
    # the launch is a release with the flag flipped, never an edit here.
    set $truyen_robots "";
    if (-f $document_root/noindex) {
        set $truyen_robots "noindex, nofollow";
    }

    # No inline script or style in the build (React sets styles through the DOM, which CSP allows); fonts are
    # self-hosted; pictures, scene videos, voice and music are files under /stories/. No account, so no avatar
    # hosts. Cloudflare Web Analytics: the zone injects its beacon (no cookies), as on the sibling apps.
    set $truyen_csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # nginx drops inherited add_header lines in a block that declares its own, so each location repeats them.

    # Vite fingerprints everything under /assets/: cached for a year; a miss is a real 404, never index.html
    # served as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri =404;
    }

    # The story list, each story.json and its media keep fixed names: revalidated, so a new story or a redrawn
    # picture shows on the next visit. A miss is a real 404 (the player reports it), not the app's HTML.
    # nginx serves byte ranges, which video seeking needs.
    location /stories/ {
        types {
            application/json json;
            image/webp       webp;
            video/mp4        mp4;
            audio/mp4        m4a;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri =404;
    }

    # Reading-scene backdrops (AVIF with a WebP fallback, painted on the home PC): fixed names, revalidated.
    location /reading-scenes/ {
        types {
            image/avif avif;
            image/webp webp;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri =404;
    }

    # The pages: /, /tre-em, /nguoi-lon and each /truyen/<slug> have their own prerendered index.html (title,
    # description, the story list; apps/web/vite-prerender.ts); every other address (legal pages, 404) gets the
    # app page spa.html. They and the other unhashed files (robots.txt, icons, manifest) are revalidated on every
    # visit, so a browser never keeps a page that points at chunks of a previous release.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $truyen_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag $truyen_robots always;
        try_files $uri $uri/index.html /spa.html;
    }
}
